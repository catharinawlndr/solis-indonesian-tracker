
name: SOLIS Indonesian Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
      timezone: 'America/New_York'
      
permissions:
  contents: read

concurrency:
  group: solis-indonesian-monitor
  cancel-in-progress: false

jobs:
  check-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 5

      - name: Test Telegram connectivity
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          response=$(curl --silent --show-error --fail-with-body \
            --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=TEST ONLY - SOLIS INDONESIAN GITHUB TRACKER. GitHub Actions can successfully send Telegram notifications. This is NOT an actual appointment alert.")

          if [ "$response" = "200" ]; then
            echo "Telegram connectivity test successful."
          else
            echo "Telegram connectivity test failed (HTTP $response)."
            exit 1
          fi

    steps:
      - name: Download tracker code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Restore previous availability
        uses: actions/cache/restore@v4
        with:
          path: solis-state.json
          key: solis-state-${{ github.run_id }}
          restore-keys: |
            solis-state-

      - name: Check SOLIS Indonesian calendar
        run: npm run check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save latest availability
        if: success()
        uses: actions/cache/save@v4
        with:
          path: solis-state.json
          key: solis-state-${{ github.run_id }}
